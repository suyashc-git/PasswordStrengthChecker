
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Check Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px #0002;
        }
        h2 { color: #243b53; }
        .result { font-size: 22px; font-weight: bold; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Password Strength Result</h2>

        <p class="result">
            Password Strength:
            <span th:text="${strength}">Weak</span>
        </p>

        <a href="/">Check another password</a>
    </div>
</body>
</html>
